<ion-header>
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="home-content" fullscreen>
  <div class="home-wrapper">
    <div class="home-card">

      <h1 class="title">Moje rezervacije</h1>
      <p class="subtitle">Pregled svih tvojih termina</p>

      <ion-list lines="full" *ngIf="reservations && reservations.length > 0">
        <ion-item *ngFor="let r of reservations">
          <ion-icon name="calendar-outline" slot="start" color="primary"></ion-icon>
          <ion-label>
            <h2>{{ r.date }}</h2>
            <p>Broj gostiju: <strong>{{ r.guestsCount }}</strong></p>
          </ion-label>
          
          <ion-badge slot="end" 
                     [color]="r.status === 'pending' ? 'warning' : (r.status === 'approved' ? 'success' : 'danger')">
            {{ r.status === 'pending' ? 'NA ČEKANJU' : (r.status === 'approved' ? 'ODOBRENO' : 'ODBIJENO') }}
          </ion-badge>
        </ion-item>
      </ion-list>

      <div class="no-reservations" *ngIf="!reservations || reservations.length === 0" style="text-align: center; padding: 20px; color: #888;">
        <ion-icon name="information-circle-outline" style="font-size: 48px; color: #ccc;"></ion-icon>
        <p>Trenutno nemate kreiranih rezervacija.</p>
      </div>

      <ion-button
        expand="block"
        class="login-btn"
        routerLink="/reservation"
        style="margin-top: 20px;">
        + Nova rezervacija
      </ion-button>

    </div>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <div class="footer-content">
      <div class="copyright">
        © 2026 Wedding-app
      </div>
      <div class="social">
        <a href="https://www.youtube.com/watch?v=450p7goxZqg" target="_blank">
          <ion-icon name="globe-outline"></ion-icon>
        </a>
        <a href="https://www.instagram.com/" target="_blank">
          <ion-icon name="logo-instagram"></ion-icon>
        </a>
      </div>
    </div>
  </ion-toolbar>
</ion-footer>
