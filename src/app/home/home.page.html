<ion-header>
  <ion-toolbar>
    <ion-title>Rezervacija termina</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-item>
    <ion-label position="stacked">
      Datum svadbe
    </ion-label>

    <ion-input
      type="date"
      [(ngModel)]="reservationDate">
    </ion-input>

  </ion-item>

  <ion-button
    expand="block"
    (click)="sendReservation()">

    Pošalji rezervaciju

  </ion-button>

</ion-content>
