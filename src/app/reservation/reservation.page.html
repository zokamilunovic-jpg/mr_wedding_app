<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Reservation</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="reservation-content">
  <div class="reservation-wrapper">
    <div class="reservation-card">

      <h1 class="title">
        <ion-icon name="heart"></ion-icon>
        Rezervacija termina
        <ion-icon name="heart"></ion-icon>
      </h1>

      <p class="subtitle">
        Izaberi datum i pošalji zahtev
      </p>

      <ion-item lines="none" class="input-item">
        <ion-label position="floating">Datum svadbe</ion-label>
        <ion-input type="date" [(ngModel)]="reservationDate"></ion-input>
      </ion-item>

      <ion-item lines="none" class="input-item">
        <ion-label position="floating">Broj gostiju</ion-label>
        <ion-input 
          type="number" 
          [(ngModel)]="guestsCount"
          (ionInput)="onGuestsCountChange()">
        </ion-input>
      </ion-item>

      <div style="text-align: center; margin: 15px 0;">
        <ion-button fill="outline" color="secondary" (click)="openServicesModal()">
          Izaberite usluge ▲
        </ion-button>
        <p *ngIf="selectedServices.length > 0" style="font-size: 13px; color: #666; margin: 5px 0 0 0;">
          Odabrano usluga: {{ selectedServices.join(', ') }}
        </p>
      </div>

      <div class="price-container" style="text-align: center; margin: 15px 0; padding: 10px; background: #fff5f8; border-radius: 8px;">
        <span style="font-size: 16px; color: #555;">Ukupna cena:</span>
        <h2 style="margin: 5px 0; color: #e91e63; font-weight: bold;">{{ totalPrice }} EUR</h2>
      </div>

      <ion-button
        expand="block"
        class="login-btn"
        (click)="sendReservation()">
        Pošalji rezervaciju
      </ion-button>

    </div>
  </div>
</ion-content>
